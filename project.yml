name: UnliRice

options:
  bundleIdPrefix: com.calmdownoscar
  deploymentTarget:
    macOS: "13.0"
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_HARDENED_RUNTIME: YES
    CLANG_ENABLE_MODULES: YES
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: YES
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

targets:
  UnliRiceCore:
    type: library.static
    platform: macOS
    sources:
      - Sources/UnliRiceCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calmdownoscar.unlirice.core

  UnliRiceCoreiOS:
    type: library.static
    platform: iOS
    sources:
      - Sources/UnliRiceCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calmdownoscar.unlirice.core.ios
        PRODUCT_MODULE_NAME: UnliRiceCore
        # Matches Package.swift's .iOS(.v26) so SwiftPM and Xcode agree.
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"

  UnliRiceCapture:
    type: application
    platform: iOS
    sources:
      - path: Sources/UnliRiceCapture
        excludes:
          - Resources
      - path: Sources/UnliRiceCapture/Resources
        buildPhase: resources
    dependencies:
      - target: UnliRiceCoreiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calmdownoscar.unlirice.capture
        PRODUCT_NAME: UnliRiceCapture
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "4"
        INFOPLIST_KEY_CFBundleDisplayName: "Unli Rice Capture"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: 22SNGN5JYD
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Unli Rice Capture uses your microphone to dictate notes."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Unli Rice Capture uses speech recognition to transcribe voice notes."
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        GENERATE_INFOPLIST_FILE: YES
        # UIBackgroundModes and UIFileSharingEnabled live in this file rather
        # than as INFOPLIST_KEY_* settings: Xcode 26 has no mapping for either,
        # so setting them here silently produced a build without them. The
        # INFOPLIST_KEY_* settings above still merge into this file.
        INFOPLIST_FILE: UnliRiceCapture-Info.plist
        # Without a UILaunchScreen entry iOS runs the app at a legacy screen
        # size and letterboxes it — black bars, and not the full display.
        # GENERATE_INFOPLIST_FILE does not add one on its own.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # SpeechAnalyzer/SpeechTranscriber require 26; see Package.swift.
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"

  UnliRiceHost:
    type: library.static
    platform: macOS
    sources:
      - Sources/UnliRiceHost
    dependencies:
      - target: UnliRiceCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calmdownoscar.unlirice.host

  unlirice-mcp:
    type: tool
    platform: macOS
    sources:
      - Sources/unlirice-mcp
    dependencies:
      - target: UnliRiceCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calmdownoscar.unlirice.mcp
        CODE_SIGN_ENTITLEMENTS: UnliRiceHelper.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 22SNGN5JYD
        ENABLE_APP_SANDBOX: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        GENERATE_INFOPLIST_FILE: YES
        OTHER_CODE_SIGN_FLAGS: "$(inherited) -i $(PRODUCT_BUNDLE_IDENTIFIER)"
        SKIP_INSTALL: YES

  unlirice-agent:
    type: tool
    platform: macOS
    sources:
      - Sources/unlirice-agent
    dependencies:
      - target: UnliRiceCore
      - target: UnliRiceHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calmdownoscar.unlirice.agent
        CODE_SIGN_ENTITLEMENTS: UnliRiceHelper.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 22SNGN5JYD
        ENABLE_APP_SANDBOX: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        GENERATE_INFOPLIST_FILE: YES
        OTHER_CODE_SIGN_FLAGS: "$(inherited) -i $(PRODUCT_BUNDLE_IDENTIFIER)"
        SKIP_INSTALL: YES

  unlirice-cli:
    type: tool
    platform: macOS
    sources:
      - Sources/unlirice-cli
    dependencies:
      - target: UnliRiceCore
      - target: UnliRiceHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calmdownoscar.unlirice.cli
        CODE_SIGN_ENTITLEMENTS: UnliRiceHelper.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 22SNGN5JYD
        ENABLE_APP_SANDBOX: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        GENERATE_INFOPLIST_FILE: YES
        OTHER_CODE_SIGN_FLAGS: "$(inherited) -i $(PRODUCT_BUNDLE_IDENTIFIER)"
        SKIP_INSTALL: YES

  UnliRice:
    type: application
    platform: macOS
    sources:
      - path: Sources/UnliRice
        excludes:
          - Resources
      - path: Sources/UnliRice/Resources
        buildPhase: resources
    dependencies:
      - target: UnliRiceCore
      - target: UnliRiceHost
      - target: unlirice-mcp
        link: false
        embed: false
      - target: unlirice-agent
        link: false
        embed: false
      - target: unlirice-cli
        link: false
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calmdownoscar.unlirice
        PRODUCT_NAME: Unli Rice
        PRODUCT_MODULE_NAME: UnliRice
        EXECUTABLE_NAME: UnliRice
        CODE_SIGN_ENTITLEMENTS: UnliRice.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 22SNGN5JYD
        ENABLE_APP_SANDBOX: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "4"
        INFOPLIST_KEY_CFBundleDisplayName: Unli Rice
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 calmdownoscar. All rights reserved.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        GENERATE_INFOPLIST_FILE: YES
    postCompileScripts:
      - name: Embed sandboxed helpers
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          app_macos="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/MacOS"
          launch_agents="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchAgents"
          mkdir -p "$app_macos" "$launch_agents"
          install -m 755 "$BUILT_PRODUCTS_DIR/unlirice-mcp" "$app_macos/unlirice-mcp"
          install -m 755 "$BUILT_PRODUCTS_DIR/unlirice-agent" "$app_macos/unlirice-agent"
          install -m 755 "$BUILT_PRODUCTS_DIR/unlirice-cli" "$app_macos/unlirice-cli"
          install -m 644 "$SRCROOT/Config/LaunchAgents/com.calmdownoscar.unlirice.agent.plist" "$launch_agents/com.calmdownoscar.unlirice.agent.plist"

  UnliRiceCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/UnliRiceCoreTests
    dependencies:
      - target: UnliRiceCore
      - target: UnliRiceHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calmdownoscar.unlirice.tests

schemes:
  UnliRice:
    build:
      targets:
        UnliRice: all
        UnliRiceCoreTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - UnliRiceCoreTests
    archive:
      config: Release
