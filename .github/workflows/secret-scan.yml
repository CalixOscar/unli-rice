name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan changes since base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"
          else
            BASE="$PUSH_BEFORE_SHA"
          fi
          case "$BASE" in
            ""|0000000000000000000000000000000000000000) BASE="" ;;
          esac
          if [ -n "$BASE" ] && ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=""
          fi
          if [ -z "$BASE" ]; then
            BASE=$(git rev-parse --verify --quiet HEAD~1 || true)
          fi
          if [ -z "$BASE" ]; then
            echo "No base commit found; nothing to scan."
            exit 0
          fi
          echo "Scanning changes since $BASE"
          git reset --soft "$BASE"
          sh Scripts/check-secrets.sh
